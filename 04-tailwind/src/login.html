<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-700 rounded-lg p-8 shadow-lg max-w-sm w-full">
      <h1>Login</h1>
      <form>
        <div>
          <label for="">Email</label>
          <input type="email" name="" placeholder="Email" id="" class="bg-white text-black"/>
        </div>
        <div>
          <label for="">Password</label>
          <input type="password" name="" placeholder="Password" id=""  class="bg-white text-black"/>
        </div>
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
