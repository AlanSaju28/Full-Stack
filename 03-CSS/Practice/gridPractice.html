<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout In CSS</title>
    <style>
      body {
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
      }
      .box {
        margin: 20px;
        border: 3px solid orange;
      }
    </style>
  </head>
  <body>
    <h1 style="color: white">Grid Layout Practice</h1>
    <div
      class="grid-container"
      style="color: white; border: 1px solid white; display: grid"
    >
      <div
        class="container"
        style="margin: 20px; padding: 30px; border: 3px solid orange"
      >
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
      </div>
    </div>
  </body>
</html>
